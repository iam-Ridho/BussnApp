name: backend-ci
on:
  pull_request:
  push:
    branches: [develop, main]
defaults:
  run:
    working-directory: backend
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bussnapp
          POSTGRES_USER: bussn_owner
          POSTGRES_PASSWORD: bussn_owner_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bussn_owner -d bussnapp"
          --health-interval 5s --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+asyncpg://bussn_app:bussn_app_dev@localhost:5432/bussnapp
      MIGRATOR_DATABASE_URL: postgresql+psycopg://bussn_owner:bussn_owner_dev@localhost:5432/bussnapp
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: PGPASSWORD=bussn_owner_dev psql -h localhost -U bussn_owner -d bussnapp -f docker/postgres/init/01-init.sql
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pytest
