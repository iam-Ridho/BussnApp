[project]
name = "bussnapp-backend"
version = "0.1.0"
description = "BussnApp backend: REST API, Rule Engine, AI Gateway"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.5",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: butuh PostgreSQL yang sudah termigrasi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
