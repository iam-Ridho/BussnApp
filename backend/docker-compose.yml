name: bussnapp
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bussnapp
      POSTGRES_USER: bussn_owner          # pemilik tabel + dipakai Alembic
      POSTGRES_PASSWORD: bussn_owner_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # skrip di folder ini hanya jalan saat volume masih kosong
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bussn_owner -d bussnapp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
